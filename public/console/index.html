<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      // Kith moved from orrey.alxjrvs.com and kith.alxjrvs.com. Static pages never reach the Worker, so they hop here.
      if (location.hostname === "orrey.alxjrvs.com" || location.hostname === "kith.alxjrvs.com") location.replace("https://kith.town" + location.pathname + location.search + location.hash);
    </script>
    <title>Kith console</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!--
      The design system lives in `design/` and is not shipped: `public/` is what
      the ASSETS binding serves. These files are verbatim copies of
      design/tokens/*.css — copied rather than imported, and never edited here.
      There is no build step in this repo and this is not the phase to add one.
    -->
    <link rel="stylesheet" href="/console/tokens/colors.css" />
    <link rel="stylesheet" href="/console/tokens/fonts.css" />
    <link rel="stylesheet" href="/console/tokens/typography.css" />
    <link rel="stylesheet" href="/console/tokens/spacing.css" />
    <link rel="stylesheet" href="/console/tokens/borders.css" />
    <link rel="stylesheet" href="/console/tokens/motion.css" />
    <link rel="stylesheet" href="/console/tokens/base.css" />
    <link rel="stylesheet" href="/console/console.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600&family=Schibsted+Grotesk:wght@800&display=swap" />
  </head>
  <body>
    <!--
      The site's header, written out by hand: the same header every signed-in
      page of the site wears (web/src/components/Header.tsx). Keep the two alike.
    -->
    <header class="site-header">
      <a href="/" class="wordmark"><img src="/mark.svg" alt="" width="22" height="22" />Kith.town</a>
      <nav aria-label="Main" class="site-nav">
        <a href="/games">Games</a>
        <a href="/agenda">Agenda</a>
        <a href="/coc">Rules</a>
        <a href="/slideshow">Slideshow</a>
        <a href="/console" aria-current="page">Organise</a>
      </nav>
      <a href="/profile" class="avatar" id="avatar" aria-label="Your profile"></a>
    </header>

    <main id="main" aria-busy="true">
      <p class="note" id="status">Loading…</p>
    </main>

    <script type="module" src="/console/console.js"></script>
  </body>
</html>
