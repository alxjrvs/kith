<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      // Kith moved from orrey.alxjrvs.com and kith.alxjrvs.com. Static pages never reach the Worker, so they hop here.
      if (location.hostname === "orrey.alxjrvs.com" || location.hostname === "kith.alxjrvs.com") location.replace("https://kith.town" + location.pathname + location.search + location.hash);
    </script>
    <title>Kith console</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!--
      The console wears the site's Ember Table look: the same tokens as
      web/src/styles.css, written out in console.css because the console has no
      build step. The Discord-grey tokens in design/ are the old console's.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..700&family=Hanken+Grotesk:wght@400;500;600;700&family=Schibsted+Grotesk:wght@700;800&family=Spline+Sans+Mono:wght@400;500&display=swap" />
    <link rel="stylesheet" href="/console/console.css" />
  </head>
  <body>
    <!--
      The site's header, written out by hand: the same header every signed-in
      page of the site wears (web/src/components/Header.tsx). Keep the two alike.
    -->
    <header class="site-header">
      <a href="/" class="wordmark"><img src="/mark.svg" alt="" width="22" height="22" />Kith.town</a>
      <nav aria-label="Main" class="site-nav">
        <a href="/games">Games</a>
        <a href="/agenda">Agenda</a>
        <a href="/coc">Rules</a>
        <a href="/slideshow">Slideshow</a>
        <a href="/console" aria-current="page">Organise</a>
      </nav>
      <a href="/profile" class="avatar" id="avatar" aria-label="Your profile"></a>
    </header>

    <main id="main" class="page" aria-busy="true">
      <p class="muted" id="status">Loading…</p>
    </main>

    <script type="module" src="/console/console.js"></script>
  </body>
</html>
