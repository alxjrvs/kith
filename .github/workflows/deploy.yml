name: Deploy

# Production follows main: once CI is green on a push to main, the site is
# built, D1 migrations are applied, and the Worker (with the site as its
# assets) is deployed. Runs can also be started by hand from the Actions tab.
#
# Needs two repository secrets: CLOUDFLARE_API_TOKEN (Workers Scripts edit,
# D1 edit, Workers Routes edit, Zone DNS edit for the custom domain) and
# CLOUDFLARE_ACCOUNT_ID. Until they exist this workflow fails at the first
# wrangler step and production is untouched.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Apply D1 migrations
        run: bunx wrangler d1 migrations apply orrey --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy the Worker
        run: bunx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
