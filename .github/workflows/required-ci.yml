name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      # The Workers test pool runs under Node, so Node stays on the runner.
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test

  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run build

  # The one "CI" check (factory:repo-ruleset): it fails if any job it needs
  # failed or was cancelled, and runs with if: always() so a failed dependency
  # can't leave it pending. Deploy keys on this workflow's run, and the ruleset
  # requires this job. List every job in `needs`.
  ci:
    name: CI
    if: always()
    needs: [check, build-web]
    runs-on: ubuntu-latest
    steps:
      - name: All required jobs passed
        run: |
          [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "false" ]
